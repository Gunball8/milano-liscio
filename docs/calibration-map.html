<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calibrage Milano Liscio</title>
<!-- Development page (SPEC §11 phase 1). Data: ./calibration-map.data.js, generated by `pnpm calibrate`. -->
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root { --bg: #ffffff; --fg: #1f2328; --muted: #656d76; --line: #d0d7de; }
  html, body { margin: 0; height: 100%; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--fg); background: var(--bg); }
  #map { position: absolute; inset: 0; }
  #panel { position: absolute; top: 10px; left: 10px; width: 390px; max-width: calc(100% - 40px); max-height: calc(100% - 40px); overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  h1 { font-size: 15px; margin: 0 0 8px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 12px 0 4px; }
  select { width: 100%; font: inherit; padding: 3px; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  td, th { padding: 3px 4px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  td:first-child, th:first-child { text-align: left; }
  tr.sel { background: #f3f0ff; font-weight: 600; }
  tr { cursor: pointer; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; margin-right: 10px; }
  .sw { display: inline-block; width: 18px; border-top: 4px solid; }
  .muted { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h1>Calibrage des niveaux</h1>
  <select id="pair"></select>
  <h2>Niveaux (toucher une ligne pour l'afficher)</h2>
  <div style="overflow-x:auto"><table id="stats"></table></div>
  <h2>Légende</h2>
  <div class="legend">
    <span><i class="sw" style="border-color:#495057"></i>lisse</span>
    <span><i class="sw" style="border-color:#f08c00"></i>dalles</span>
    <span><i class="sw" style="border-color:#d6336c"></i>pavé</span>
    <span><i class="sw" style="border-color:#7048e8"></i>rails</span>
    <span><i class="sw" style="border-color:#495057;border-top-style:dotted"></i>à pied</span>
  </div>
  <p class="muted">Le niveau choisi est coloré par revêtement ; les autres restent en gris fin pour comparer.</p>
</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="./calibration-map.data.js"></script>
<script>
(function () {
  const C = window.CALIB;
  const sel = document.getElementById('pair');
  const stats = document.getElementById('stats');
  if (!C) { sel.outerHTML = '<p>calibration-map.data.js introuvable : lancez « pnpm calibrate ».</p>'; return; }
  C.pairs.forEach((p, i) => { const o = document.createElement('option'); o.value = i; o.textContent = `${i + 1}. ${p.label}`; sel.appendChild(o); });
  let pairIdx = 0;
  let level = 2;
  const map = new maplibregl.Map({ container: 'map', style: 'https://tiles.openfreemap.org/styles/positron', center: [9.19, 45.464], zoom: 13 });
  window.__map = map;
  map.addControl(new maplibregl.NavigationControl(), 'top-right');
  map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-right');

  const colorOf = (s) => (s.cls === 2 ? '#d6336c' : s.cls === 1 ? '#f08c00' : s.rail ? '#7048e8' : '#495057');
  function data() {
    const p = C.pairs[pairIdx];
    const features = [];
    for (const r of p.routes) {
      for (const s of r.segments) {
        features.push({ type: 'Feature', properties: { level: r.level, chosen: r.level === level ? 1 : 0, color: colorOf(s), push: s.push ? 1 : 0 }, geometry: { type: 'LineString', coordinates: s.coords } });
      }
    }
    features.push({ type: 'Feature', properties: { pt: 'A' }, geometry: { type: 'Point', coordinates: [p.from.lon, p.from.lat] } });
    features.push({ type: 'Feature', properties: { pt: 'B' }, geometry: { type: 'Point', coordinates: [p.to.lon, p.to.lat] } });
    return { type: 'FeatureCollection', features };
  }
  function renderTable() {
    const p = C.pairs[pairIdx];
    stats.innerHTML = '<tr>' + C.headers.map((h) => `<th>${h}</th>`).join('') + '</tr>' +
      p.routes.map((r) => `<tr data-level="${r.level}" class="${r.level === level ? 'sel' : ''}">${r.row.map((c) => `<td>${c}</td>`).join('')}</tr>`).join('');
  }
  function fit() {
    const p = C.pairs[pairIdx];
    let b = [Infinity, Infinity, -Infinity, -Infinity];
    for (const r of p.routes) for (const s of r.segments) for (const [x, y] of s.coords) b = [Math.min(b[0], x), Math.min(b[1], y), Math.max(b[2], x), Math.max(b[3], y)];
    map.fitBounds([[b[0], b[1]], [b[2], b[3]]], { padding: { top: 40, bottom: 40, left: 420, right: 40 }, duration: 0 });
  }
  function update() { renderTable(); if (map.getSource('routes')) map.getSource('routes').setData(data()); }

  map.on('load', () => {
    map.addSource('routes', { type: 'geojson', data: data() });
    const w = (b) => ['interpolate', ['linear'], ['zoom'], 12, b * 0.6, 16, b * 1.6];
    map.addLayer({ id: 'others', type: 'line', source: 'routes', filter: ['all', ['==', ['geometry-type'], 'LineString'], ['==', ['get', 'chosen'], 0]], layout: { 'line-cap': 'round' }, paint: { 'line-color': '#868e96', 'line-width': w(2), 'line-opacity': 0.7 } });
    map.addLayer({ id: 'chosen-ride', type: 'line', source: 'routes', filter: ['all', ['==', ['geometry-type'], 'LineString'], ['==', ['get', 'chosen'], 1], ['==', ['get', 'push'], 0]], layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': ['get', 'color'], 'line-width': w(5) } });
    map.addLayer({ id: 'chosen-push', type: 'line', source: 'routes', filter: ['all', ['==', ['geometry-type'], 'LineString'], ['==', ['get', 'chosen'], 1], ['==', ['get', 'push'], 1]], paint: { 'line-color': ['get', 'color'], 'line-width': w(4), 'line-dasharray': [0.5, 1.5] } });
    map.addLayer({ id: 'ends', type: 'circle', source: 'routes', filter: ['==', ['geometry-type'], 'Point'], paint: { 'circle-radius': 7, 'circle-color': ['match', ['get', 'pt'], 'A', '#2f9e44', '#1f2328'], 'circle-stroke-color': '#fff', 'circle-stroke-width': 2 } });
    fit();
  });
  sel.addEventListener('change', () => { pairIdx = Number(sel.value); update(); fit(); });
  stats.addEventListener('click', (e) => { const tr = e.target.closest('tr[data-level]'); if (!tr) return; level = Number(tr.dataset.level); update(); });
  renderTable();
})();
</script>
</body>
</html>

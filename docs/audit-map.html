<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audit Milano Liscio</title>
<!-- Development page (SPEC §11 phase 0): online tiles allowed. Data comes from ./audit-map.data.js, generated by `pnpm data:audit`. -->
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root { --bg: #ffffff; --fg: #1f2328; --muted: #656d76; --line: #d0d7de; }
  html, body { margin: 0; height: 100%; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--fg); background: var(--bg); }
  #map { position: absolute; inset: 0; }
  #panel { position: absolute; top: 10px; left: 10px; width: 270px; max-height: calc(100% - 40px); overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  #panel h1 { font-size: 15px; margin: 0 0 2px; }
  #panel .meta { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  #panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 12px 0 4px; }
  label { display: flex; align-items: center; gap: 6px; padding: 2px 0; cursor: pointer; }
  .sw { display: inline-block; width: 22px; height: 0; border-top: 4px solid; flex: none; }
  .sw.dash { border-top-style: dashed; }
  .dvals { display: flex; gap: 10px; }
  select { width: 100%; font: inherit; padding: 3px; }
  .maplibregl-popup-content { font-size: 12px; max-width: 320px; }
  .maplibregl-popup-content b { font-size: 13px; }
  .k { color: var(--muted); }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h1>Audit Milano Liscio</h1>
  <div class="meta" id="meta">Chargement…</div>

  <h2>Chaussée sur rails (D)</h2>
  <div class="dvals" id="dvals"></div>

  <h2>Couches</h2>
  <label><input type="checkbox" data-layer="marked" checked><span class="sw" style="border-color:rgba(112,72,232,.45);border-top-width:8px"></span>Chaussée marquée « sur rails »</label>
  <label><input type="checkbox" data-layer="c2" checked><span class="sw" style="border-color:#d6336c"></span>PAVE</label>
  <label><input type="checkbox" data-layer="c1" checked><span class="sw" style="border-color:#f08c00"></span>SLABS</label>
  <label><input type="checkbox" data-layer="c3" checked><span class="sw" style="border-color:#8d6e63"></span>LOOSE</label>
  <label><input type="checkbox" data-layer="c4" checked><span class="sw dash" style="border-color:#495057"></span>UNKNOWN (sans surface)</label>
  <label><input type="checkbox" data-layer="c0" checked><span class="sw" style="border-color:#adb5bd"></span>SMOOTH</label>
  <label><input type="checkbox" data-layer="embedded" checked><span class="sw dash" style="border-color:#000"></span>Tag <code>embedded_rails</code></label>
  <label><input type="checkbox" data-layer="rails" checked><span class="sw" style="border-color:#7048e8;border-top-width:2px"></span>Rails tram</label>
  <label><input type="checkbox" data-layer="rails-other" checked><span class="sw dash" style="border-color:#9775fa;border-top-width:2px"></span>Rails désaffectés / chantier</label>
  <label><input type="checkbox" data-layer="perims" checked><span class="sw dash" style="border-color:#1971c2;border-top-width:2px"></span>Commune et centre</label>

  <h2>Aller à une rue</h2>
  <select id="street"><option value="">—</option></select>

  <h2>Lecture</h2>
  <div class="meta">Touchez un tronçon pour ses tags. Comparez la bande violette (chaussée marquée) aux rails : un boulevard avec tram en site propre ne devrait pas être marqué.</div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="./audit-map.data.js"></script>
<script>
(function () {
  const A = window.AUDIT;
  if (!A) { document.getElementById('meta').textContent = 'audit-map.data.js introuvable : lancez « pnpm data:audit ».'; return; }
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const toLine = (flat) => { const l = []; for (let i = 0; i < flat.length; i += 2) l.push([flat[i], flat[i + 1]]); return l; };

  document.getElementById('meta').textContent =
    `OSM du ${(A.osmBase || '?').slice(0, 10)} · ${A.edges.length.toLocaleString('fr-FR')} tronçons · centre : ${A.center.label}`;

  const edges = {
    type: 'FeatureCollection',
    features: A.edges.map(([wi, c, md, rl, coords], i) => {
      const w = A.ways[wi];
      return { type: 'Feature', id: i, properties: { wi, c, md: md || 99, emb: w[6] && w[6] !== 'no' ? 1 : 0, rl: rl.join(' / ') }, geometry: { type: 'LineString', coordinates: toLine(coords) } };
    }),
  };
  const rails = {
    type: 'FeatureCollection',
    features: A.rails.map(([id, kind, layer, date, coords]) => ({
      type: 'Feature', properties: { id, kind, layer, date, tram: kind === 'railway=tram' ? 1 : 0 }, geometry: { type: 'LineString', coordinates: toLine(coords) },
    })),
  };
  const perims = {
    type: 'FeatureCollection',
    features: [
      { type: 'Feature', properties: { k: 'commune' }, geometry: A.commune },
      { type: 'Feature', properties: { k: 'center' }, geometry: A.center.geometry },
    ],
  };

  const map = new maplibregl.Map({
    container: 'map',
    center: [9.19, 45.464],
    zoom: 13.5,
    hash: true,
    // OpenFreeMap: free vector basemap, no API key (CARTO raster tiles started requiring one).
    style: 'https://tiles.openfreemap.org/styles/positron',
  });
  window.__map = map; // for scripted checks
  map.addControl(new maplibregl.NavigationControl(), 'top-right');
  map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-right');

  const width = (base) => ['interpolate', ['linear'], ['zoom'], 11, base * 0.4, 14, base, 18, base * 3];
  const COLORS = ['#adb5bd', '#f08c00', '#d6336c', '#8d6e63', '#495057'];
  let D = 4;

  map.on('load', () => {
    map.addSource('edges', { type: 'geojson', data: edges });
    map.addSource('rails', { type: 'geojson', data: rails });
    map.addSource('perims', { type: 'geojson', data: perims });

    map.addLayer({ id: 'perims', type: 'line', source: 'perims', paint: { 'line-color': ['match', ['get', 'k'], 'commune', '#495057', '#1971c2'], 'line-width': 2, 'line-dasharray': [3, 2] } });
    map.addLayer({ id: 'marked', type: 'line', source: 'edges', filter: ['<=', ['get', 'md'], D], layout: { 'line-cap': 'round' }, paint: { 'line-color': '#7048e8', 'line-opacity': 0.35, 'line-width': width(9) } });
    // Draw order: smooth first, then unknown, loose, slabs, pave on top.
    for (const c of [0, 4, 3, 1, 2]) {
      map.addLayer({
        id: 'c' + c, type: 'line', source: 'edges', filter: ['==', ['get', 'c'], c],
        layout: { 'line-cap': c === 4 ? 'butt' : 'round' },
        paint: Object.assign({ 'line-color': COLORS[c], 'line-width': width(c === 0 ? 1.2 : c === 4 ? 1.6 : 2.6) }, c === 4 ? { 'line-dasharray': [2, 1.5] } : {}),
      });
    }
    map.addLayer({ id: 'embedded', type: 'line', source: 'edges', filter: ['==', ['get', 'emb'], 1], paint: { 'line-color': '#000', 'line-width': 1, 'line-dasharray': [1, 2], 'line-offset': 3 } });
    map.addLayer({ id: 'rails-other', type: 'line', source: 'rails', filter: ['==', ['get', 'tram'], 0], paint: { 'line-color': '#9775fa', 'line-width': width(1.2), 'line-dasharray': [2, 2] } });
    map.addLayer({ id: 'rails', type: 'line', source: 'rails', filter: ['==', ['get', 'tram'], 1], paint: { 'line-color': '#7048e8', 'line-width': width(1.2) } });

    const CLICKABLE = ['c0', 'c1', 'c2', 'c3', 'c4', 'rails', 'rails-other'];
    map.on('click', (e) => {
      const box = [[e.point.x - 6, e.point.y - 6], [e.point.x + 6, e.point.y + 6]];
      const f = map.queryRenderedFeatures(box, { layers: CLICKABLE.filter((id) => map.getLayoutProperty(id, 'visibility') !== 'none') })[0];
      if (!f) return;
      let html;
      if (f.source === 'rails') {
        const p = f.properties;
        html = `<b>Rail ${esc(p.kind)}</b><br><span class="k">layer</span> ${esc(p.layer || '0')} · <span class="k">modifié</span> ${esc(p.date)}<br><a href="https://www.openstreetmap.org/way/${p.id}" target="_blank">way ${p.id}</a>`;
      } else {
        const p = f.properties;
        const [id, name, hw, surface, smooth, date, emb, sbike, cw, mode, area] = A.ways[p.wi];
        html = `<b>${esc(name || '(sans nom)')}</b><br>` +
          `${esc(hw)} · ${esc(mode)}${area ? ' · area' : ''}<br>` +
          `<span class="k">surface</span> ${esc(surface || '–')} · <span class="k">smoothness</span> ${esc(smooth || '–')} → <b>${A.classes[p.c]}</b><br>` +
          (sbike ? `<span class="k">surface_bike</span> ${esc(sbike)}<br>` : '') +
          (cw ? `<span class="k">${esc(cw)}</span><br>` : '') +
          (emb ? `<span class="k">embedded_rails</span> ${esc(emb)}<br>` : '') +
          (p.rl ? `<span class="k">rails (m) D3/4/5/6</span> ${esc(p.rl)}${p.md < 99 ? ` · marqué dès D=${p.md}` : ''}<br>` : '') +
          `<span class="k">modifié</span> ${esc(date)} · <a href="https://www.openstreetmap.org/way/${id}" target="_blank">way ${id}</a>`;
      }
      new maplibregl.Popup({ maxWidth: '340px' }).setLngLat(e.lngLat).setHTML(html).addTo(map);
    });
    map.on('mousemove', (e) => {
      const box = [[e.point.x - 4, e.point.y - 4], [e.point.x + 4, e.point.y + 4]];
      map.getCanvas().style.cursor = map.queryRenderedFeatures(box, { layers: CLICKABLE }).length ? 'pointer' : '';
    });
  });

  // D selector
  const dvals = document.getElementById('dvals');
  for (const d of A.dValues) {
    const l = document.createElement('label');
    l.innerHTML = `<input type="radio" name="d" value="${d}" ${d === D ? 'checked' : ''}> ${d} m`;
    dvals.appendChild(l);
  }
  dvals.addEventListener('change', (e) => {
    D = Number(e.target.value);
    if (map.getLayer('marked')) map.setFilter('marked', ['<=', ['get', 'md'], D]);
  });

  // layer toggles
  document.querySelectorAll('input[data-layer]').forEach((cb) => {
    cb.addEventListener('change', () => {
      if (map.getLayer(cb.dataset.layer)) map.setLayoutProperty(cb.dataset.layer, 'visibility', cb.checked ? 'visible' : 'none');
    });
  });

  // street picker
  const sel = document.getElementById('street');
  const groups = [['Rues de contrôle (§5)', A.streets.control], ['Plus longues rues SLABS (§6)', A.streets.slabs]];
  for (const [label, obj] of groups) {
    const og = document.createElement('optgroup');
    og.label = label;
    for (const [name, b] of Object.entries(obj)) {
      const o = document.createElement('option');
      o.value = JSON.stringify(b);
      o.textContent = name;
      og.appendChild(o);
    }
    sel.appendChild(og);
  }
  sel.addEventListener('change', () => {
    if (!sel.value) return;
    const b = JSON.parse(sel.value);
    map.fitBounds([[b[0], b[1]], [b[2], b[3]]], { padding: 60, maxZoom: 18 });
  });
})();
</script>
</body>
</html>
